version: '3.8'

services:
  web:
    build: .
    container_name: apache_php_app
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SENHA
      MYSQL_DATABASE: projeto_bootstrap
      MYSQL_USER: meu_projeto
      MYSQL_PASSWORD: SENHA
    ports:
      - "3306:3306"
    volumes:
      - /data/projeto_bootstrap/db_MySQL:/var/lib/mysql

  # --- NOVO SERVIÇO: phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_app
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: SENHA
    depends_on:
      - db

volumes:
  db_data:
